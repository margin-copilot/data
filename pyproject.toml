[project]
name = "riad-data"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deltalake==1.6.6",
  "httpx==0.28.1",
  "msal==1.39.0",
  "mssql-python==1.17.0",
  "pyarrow==26.0.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
riad-fabric = "riad_data.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
